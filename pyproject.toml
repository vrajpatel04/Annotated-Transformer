[project]
name = "annotated-transformer"
version = "0.1.0"
description = "Modular OOP implementation of the Annotated Transformer on Multi30k"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2",
    "torchtext>=0.18",
    "torchdata>=0.8",
    "spacy>=3.7",
    "sacrebleu>=2.4",
    "plotly>=5.18",
    "pyyaml>=6.0",
    "GPUtil>=1.4",
    "pandas>=2.0",
]

[project.scripts]
train-transformer = "transformer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transformer"]

[tool.hatch.build]
sources = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = []

[tool.hatch.build.targets.sdist]
include = ["src/transformer", "configs", "main.py"]
